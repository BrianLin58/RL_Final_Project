tensorboard:
  run_id: "medium_test_time_mini_11"
wandb:
  enabled: true
  run_id: "medium_test_time_mini_11"
  project: "rl_final"
  sync_tensorboard: true

train:
  algorithm: "PPO"
  policy_network: "MlpPolicy"
  save_path: "model/medium_test_time_mini_11"
  num_train_envs: 4
  epoch_num: 100
  timesteps_per_epoch: 128
  eval_episode_num: 180
  batch_size: 32
  n_steps: 8
  data_root: "data/GOT10_medium/train"
  stack: 3
  action_repeat: 32
  encoder: "ResNet18"

valid:
  data_root: "data/GOT10_medium/val"

visualize:
  index: []