augmentations:
  - type: MotionBlur
    params:
      blur_limit: [3, 7]
      allow_shifted: False
    p: 1.0

  - type: GaussianBlur
    params:
      blur_limit: [3, 5]
      sigma_limit: [0.3, 1.0]
    p: 1.0

  - type: Downscale
    params:
      scale_min: 0.7
      scale_max: 0.9
    p: 1.0

  - type: GaussNoise
    params:
      var_limit: [5.0, 20.0]
      mean: 0.0
    p: 1.0

  - type: ImageCompression
    params:
      quality_lower: 40
      quality_upper: 70
    p: 1.0

settings:
  seed: 42
  keep_original_size: true
