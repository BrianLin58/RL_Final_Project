augmentations:
  - type: MotionBlur
    params:
      blur_limit: [7, 15]
      allow_shifted: False
    p: 1.0

  - type: GaussianBlur
    params:
      blur_limit: [3, 7]
      sigma_limit: [0.7, 1.8]
    p: 1.0

  - type: Downscale
    params:
      scale_min: 0.4
      scale_max: 0.7
    p: 1.0

  - type: GaussNoise
    params:
      var_limit: [20.0, 60.0]
      mean: 0.0
    p: 1.0

  - type: ImageCompression
    params:
      quality_lower: 20
      quality_upper: 50
    p: 1.0

settings:
  seed: 42
  keep_original_size: true
