augmentations:
  - type: MotionBlur
    params:
      # long motion streaks, very challenging
      blur_limit: [15, 31]
      allow_shifted: False
    p: 1.0

  - type: GaussianBlur
    params:
      # strong defocus blur
      blur_limit: [5, 9]
      sigma_limit: [1.0, 2.5]
    p: 1.0

  - type: Downscale
    params:
      # 10% ~ 40% resolution: heavy pixelation
      scale_range: [0.1, 0.4]
    p: 1.0

  - type: ImageCompression
    params:
      # heavy JPEG artifacts
      quality_range: [5, 30]
    p: 1.0

noise:
  - type: GaussNoise
    params:
      # strong noise amplitude
      mean_range: [-0.2, 0.2]
    p: 1.0

