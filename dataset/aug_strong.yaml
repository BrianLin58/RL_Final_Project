augmentations:
  - type: MotionBlur
    params:
      blur_limit: [15, 31]
      allow_shifted: False
    p: 1.0

  - type: GaussianBlur
    params:
      blur_limit: [5, 9]
      sigma_limit: [1.0, 2.5]
    p: 1.0

  - type: Downscale
    params:
      scale_min: 0.1
      scale_max: 0.4
    p: 1.0

  - type: GaussNoise
    params:
      var_limit: [50.0, 120.0]
      mean: 0.0
    p: 1.0

  - type: ImageCompression
    params:
      quality_lower: 5
      quality_upper: 30
    p: 1.0

settings:
  seed: 42
  keep_original_size: true
